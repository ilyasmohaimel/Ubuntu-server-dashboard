<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Private local infrastructure dashboard for Frostserver">
    <title>Frostserver</title>
    <link rel="icon" type="image/svg+xml" href="/assets/frostserver-mark.svg?v=1">
    <link rel="stylesheet" href="/pixel-match.css?v=4">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
        <a class="brand" href="#overview" aria-label="Frostserver overview">
          <img src="/assets/frostserver-logo-cutout.png" alt="">
          <span><strong>Frostserver</strong><small>Server Management Dashboard</small></span>
        </a>
        <nav class="side-nav" id="sideNav" aria-label="Primary navigation"></nav>
        <section class="health-card" id="healthCard" aria-live="polite">
          <div class="health-title"><i class="status-dot"></i><strong>Connecting</strong></div>
          <p>Waiting for collector data</p>
        </section>
        <div class="side-footer">
          <a id="logsLink" href="#" target="_blank" rel="noopener noreferrer"><span class="nav-icon" data-icon="logs"></span>Logs <span aria-hidden="true">↗</span></a>
        </div>
      </aside>
      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation"></button>
      <main>
        <header class="mobile-bar">
          <button id="menuButton" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
          <strong>Frostserver</strong>
          <span class="status-dot"></span>
        </header>
        <div class="content">
          <section id="page" aria-live="polite">
            <div class="loading-panel">Loading live server data…</div>
          </section>
        </div>
      </main>
    </div>
    <script src="/app.js?v=4" defer></script>
  </body>
</html>
